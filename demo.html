<style>
:root{--bg:#F4F7F6;--surface:#FFFFFF;--ink:#15252D;--muted:#5B6B73;--line:#D5E0E0;--primary:#0B5563;--accent:#B87D08;--on-primary:#FFFFFF;--danger:#B42318;--soft:#E6EFEE;
 --ui:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic","Noto Sans SC",sans-serif;
 --mono:"Martian Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0E2A33;--surface:#133743;--ink:#E8F1F2;--muted:#9DB4BA;--line:#24505C;--primary:#5CC8C0;--accent:#F2B632;--on-primary:#06232A;--danger:#FF8A80;--soft:#18414E}}
:root[data-theme="light"]{--bg:#F4F7F6;--surface:#FFFFFF;--ink:#15252D;--muted:#5B6B73;--line:#D5E0E0;--primary:#0B5563;--accent:#B87D08;--on-primary:#FFFFFF;--danger:#B42318;--soft:#E6EFEE}
:root[data-theme="dark"]{--bg:#0E2A33;--surface:#133743;--ink:#E8F1F2;--muted:#9DB4BA;--line:#24505C;--primary:#5CC8C0;--accent:#F2B632;--on-primary:#06232A;--danger:#FF8A80;--soft:#18414E}
:root[data-theme="contrast"]{--bg:#000000;--surface:#000000;--ink:#FFFFFF;--muted:#FFFFFF;--line:#FFFFFF;--primary:#FFD400;--accent:#00E5FF;--on-primary:#000000;--danger:#FF6B6B;--soft:#1A1A1A}
:root[data-theme="ocean"]{--bg:#EAF2FB;--surface:#FFFFFF;--ink:#0D2440;--muted:#4D6380;--line:#C9D9EC;--primary:#1D4E89;--accent:#0A8793;--on-primary:#FFFFFF;--danger:#B42318;--soft:#DCE9F7}
:root[data-theme="sunrise"]{--bg:#FFF4E6;--surface:#FFFDF9;--ink:#3A1F2B;--muted:#7A5A66;--line:#F0D9C4;--primary:#A63A63;--accent:#B86E00;--on-primary:#FFFFFF;--danger:#B42318;--soft:#FBE7D5}
:root[data-theme="gold"]{--bg:#1C1810;--surface:#27211A;--ink:#F3E9D2;--muted:#BBAE92;--line:#43392A;--primary:#D4AF37;--accent:#F0D78C;--on-primary:#1C1810;--danger:#FF8A80;--soft:#30291F}
@supports (color: AccentColor){:root:not([data-theme]){--primary:AccentColor;--on-primary:AccentColorText}}
:root:not([data-theme]){color-scheme:light dark}:root[data-theme="dark"],:root[data-theme="gold"],:root[data-theme="contrast"]{color-scheme:dark}:root[data-theme="light"],:root[data-theme="ocean"],:root[data-theme="sunrise"]{color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--ui);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 18px calc(92px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 10px}
.brand{font-weight:700;font-size:15px;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
.logo{font-family:var(--mono);font-weight:700;font-size:13px;background:var(--primary);color:var(--on-primary);border-radius:7px;padding:4px 7px}
h1{font-size:22px;margin:6px 0 14px;font-weight:600}
h2{font-size:17px;margin:26px 0 10px;font-weight:600}
p{margin:0 0 10px;text-wrap:pretty}
h1,h2{text-wrap:balance}
.mlink{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;border-radius:14px;padding:14px 16px;background:#FBE4EE;color:#8E1245;cursor:pointer;text-align:start}
:root[data-theme="dark"] .mlink,:root[data-theme="gold"] .mlink,:root[data-theme="contrast"] .mlink{background:#3A1F2C;color:#F7A8C6}
@media (prefers-color-scheme:dark){:root:not([data-theme]) .mlink{background:#3A1F2C;color:#F7A8C6}}
.mlink b{display:block;font-size:16px}.mlink span{font-size:13px;opacity:.85}
.muted{color:var(--muted)}
.small{font-size:13px}
section.block{border-top:1px solid var(--line);padding:16px 0 6px}
section.block:first-of-type{border-top:0}
/* ---- hero stamp ---- */
.stamp{direction:ltr;display:flex;justify-content:center;align-items:flex-start;gap:0;font-family:var(--mono);font-weight:500;
 font-size:40px;letter-spacing:-.02em;line-height:1.05;margin:18px 0 6px;font-variant-numeric:tabular-nums;white-space:nowrap;width:100%;overflow:hidden}
.stamp .f{display:flex;flex-direction:column;align-items:center}
.stamp .f small{font-family:var(--ui);font-size:11px;white-space:nowrap;letter-spacing:0;color:var(--muted);margin-top:8px;font-weight:500}
.stamp .sep{color:var(--line);font-weight:300;padding:0 .04em}
.stamp .tick{color:var(--accent)}
.dialbox{display:flex;justify-content:center;margin:8px 0}
.dialbox svg{width:min(78vw,330px);height:auto}
.stampmini{direction:ltr;text-align:center;font-family:var(--mono);font-size:18px;margin-top:4px;white-space:nowrap;overflow:hidden}
.local{text-align:center;margin:10px 0 2px}
.local b{font-size:18px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.center{justify-content:center}
.btn{border:1px solid var(--primary);background:var(--primary);color:var(--on-primary);border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--primary)}
.btn.small{padding:6px 12px;min-height:36px;font-size:14px}
.btn.danger{border-color:var(--danger);background:transparent;color:var(--danger)}
.btn:disabled{opacity:.5}

  <p class="small muted">This page is in English.</p>
  <p><b>Global Time Protocol (GTP)</b> is a new way of writing time: one decimal timestamp that means the same moment for everyone on Earth. The day is divided into 100 Orah, each Orah into 100 Epto and each Epto into 100 Tick, written as <span class="mono" dir="ltr">YYYY:DDD:OO:EE:TT</span>.</p>
  <p>Local time stays exactly as it is. GTP sits beside it as a shared global reference, like a common language for time. <b>One World One Time™.</b></p>
  <h2>Why it matters</h2>
  <p>The world runs on more than 400 time-zone rules, daylight-saving changes and date lines. Every international meeting, deadline, broadcast and transaction pays a small “conversion tax” in confusion, mistakes and missed moments. GTP removes that tax with a single, simple number.</p>
  <ul><li><b>One reading everywhere:</b> the same moment has the same GTP timestamp in every country.</li><li><b>Decimal and simple:</b> 100 Orah in a day means Orah 50 is half the day, and 25 is a quarter.</li><li><b>Unaffected by daylight saving or time-zone changes.</b></li><li><b>Exact:</b> built on whole-number arithmetic and a published conformance test suite that anyone can run.</li><li><b>Works alongside local time,</b> not instead of it.</li></ul>
  <h2>Where GTP is useful</h2>

  <h2>The opportunity</h2>
  <p>GTP can be licensed to device makers, software platforms, broadcasters, payment networks and institutions. This app is the working showcase: it runs GTP on ordinary phones, converts to and from every time zone, and proves its accuracy on the device through the built-in conformance tests.</p>
  <h2>Limitations</h2>
  <ul><li><b>Something new to learn:</b> people know hours and minutes; Orah, Epto and Tick take a little practice.</li>
  <li><b>Local life stays local:</b> office hours, school times, weekends and holidays are still set in local time, so GTP complements local clocks rather than replacing them.</li>
  <li><b>Display resolution:</b> one Tick is 86.4 milliseconds. Uses that need finer timing keep a more precise underlying reading, which GTP supports.</li>
  <li><b>Depends on the device clock:</b> a phone set to the wrong time shows the wrong GTP.</li>
  <li><b>Adoption:</b> like any standard, its value grows as more people and systems use it.</li>
  <li><b>Web edition:</b> alarms ring only while the app is open, and there are no widgets yet; the store apps will add these.</li></ul>
